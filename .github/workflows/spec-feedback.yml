name: "Automated Specification Feedback Integration"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  update-spec:
    name: Integrate Specification Feedback
    # Strict guards:
    # 1. Private personal repositories only
    # 2. Issue comments only (exclude pull requests)
    # 3. Issue must have 'spec' or 'enhancement' label
    # 4. Comment author must be repository owner
    # 5. Exclude bot/app generated comments
    if: >-
      github.event.repository.private == true &&
      github.event.issue.pull_request == null &&
      (contains(github.event.issue.labels.*.name, 'spec') ||
       contains(github.event.issue.labels.*.name, 'spec-in-progress') ||
       contains(github.event.issue.labels.*.name, 'ready-for-dev') ||
       contains(github.event.issue.labels.*.name, 'idea') ||
       contains(github.event.issue.labels.*.name, 'enhancement')) &&
      github.event.comment.user.login == github.repository_owner &&
      !github.event.comment.performed_via_github_app

    runs-on: [self-hosted, antigravity]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Process feedback with native Antigravity CLI
        env:
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          AGY_BIN: "/home/med/.local/bin/agy"
        run: node scripts/run-antigravity-spec.mjs
