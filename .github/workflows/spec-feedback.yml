name: "Automated Specification Feedback Integration"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  update-spec:
    name: Integrate Specification Feedback
    # Strict guards:
    # 1. Private personal repositories only
    # 2. Issue comments only (exclude pull requests)
    # 3. Issue must have 'spec' or 'enhancement' label
    # 4. Comment author must be repository owner
    # 5. Exclude bot/app generated comments
    if: >-
      github.event.repository.private == true &&
      github.event.issue.pull_request == null &&
      (contains(github.event.issue.labels.*.name, 'spec') || contains(github.event.issue.labels.*.name, 'enhancement')) &&
      github.event.comment.user.login == github.repository_owner &&
      !github.event.comment.performed_via_github_app

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @google/genai

      - name: Analyze feedback and update specification
        env:
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
        run: node scripts/update-spec-from-comment.mjs
