name: "Clean PR Branch Automation for Upstream"

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'

jobs:
  mirror-clean-pr-branch:
    # Runs exclusively on the personal fork to avoid polluting upstream
    if: github.repository == 'LeMeD/antigravity-cli-telegram-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare and publish clean mirror branch
        run: |
          SRC_BRANCH="${GITHUB_REF#refs/heads/}"
          PR_BRANCH="pr/${SRC_BRANCH}"

          echo "Generating clean mirror branch for upstream: $PR_BRANCH (source: $SRC_BRANCH)"

          # Configure Git bot identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add upstream remote and fetch upstream/main
          git remote add upstream https://github.com/ardiannurcahya/antigravity-cli-telegram-bot.git || true
          git fetch upstream main

          # Switch to clean mirror branch based directly on upstream/main
          git checkout -B "$PR_BRANCH" upstream/main

          # Squash merge changes from source branch
          git merge --squash "$SRC_BRANCH"

          # Remove internal fork items (roadmap, specs, local skills, internal scripts, and private workflows)
          for target in BACKLOG.md docs .agents scripts .github/workflows/clean-pr-branch.yml .github/workflows/spec-feedback.yml; do
            if [ -e "$target" ]; then
              echo "Removing internal item: $target"
              git rm -rf "$target"
            fi
          done

          # Only commit and push if there are staged differences against upstream/main
          if ! git diff --cached --quiet; then
            COMMIT_MSG=$(git log upstream/main.."$SRC_BRANCH" --grep="^docs(backlog)" --invert-grep --grep="^refactor: translate" --invert-grep --grep="^chore: strip" --grep="^ci" --invert-grep --format=%s | head -n 1)
            if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG=$(git log -1 --format=%s "$SRC_BRANCH")
            fi
            if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG="chore: contribution for upstream PR"
            fi
            git commit -m "$COMMIT_MSG"
            git push origin "$PR_BRANCH" --force
          fi
