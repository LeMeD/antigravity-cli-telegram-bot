name: "Clean PR Branch Automation for Upstream"

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'

jobs:
  mirror-clean-pr-branch:
    # Runs exclusively on the personal fork to avoid polluting upstream
    if: github.repository == 'LeMeD/antigravity-cli-telegram-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare and publish clean mirror branch
        run: |
          SRC_BRANCH="${GITHUB_REF#refs/heads/}"
          PR_BRANCH="pr/${SRC_BRANCH}"

          echo "Generating clean mirror branch for upstream: $PR_BRANCH (source: $SRC_BRANCH)"

          # Configure Git bot identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and switch to mirror branch
          git checkout -B "$PR_BRANCH"

          # Remove internal fork items (roadmap, specs, local skills, internal scripts, and private workflows)
          MODIFIED=0
          for target in BACKLOG.md docs .agents scripts .github/workflows/clean-pr-branch.yml .github/workflows/spec-feedback.yml; do
            if [ -e "$target" ]; then
              echo "Removing internal item: $target"
              git rm -rf "$target"
              MODIFIED=1
            fi
          done

          # Create cleanup commit only if files were removed
          if [ $MODIFIED -eq 1 ]; then
            git commit -m "chore: strip internal documentation and fork workflow for upstream PR"
          fi

          # Force push mirror branch to fork repository
          git push origin "$PR_BRANCH" --force
