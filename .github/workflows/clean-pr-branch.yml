name: Nettoyage automatique de branche PR pour upstream

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'

jobs:
  mirror-clean-pr-branch:
    # S'exécute exclusivement sur le fork personnel pour ne jamais polluer l'amont
    if: github.repository == 'LeMeD/antigravity-cli-telegram-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparation et publication de la branche miroir épurée
        run: |
          SRC_BRANCH="${GITHUB_REF#refs/heads/}"
          PR_BRANCH="pr/${SRC_BRANCH}"

          echo "Génération de la branche épurée pour upstream : $PR_BRANCH (source: $SRC_BRANCH)"

          # Configuration de l'identité du bot Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Création et bascule sur la branche miroir
          git checkout -B "$PR_BRANCH"

          # Suppression des éléments internes (roadmap, spécifications, compétences et ce workflow)
          MODIFIED=0
          for target in BACKLOG.md docs .agents .github/workflows/clean-pr-branch.yml; do
            if [ -e "$target" ]; then
              echo "Suppression de l'élément interne : $target"
              git rm -rf "$target"
              MODIFIED=1
            fi
          done

          # Création du commit de nettoyage uniquement si des éléments ont été supprimés
          if [ $MODIFIED -eq 1 ]; then
            git commit -m "chore: strip internal documentation and fork workflow for upstream PR"
          fi

          # Publication forcée de la branche miroir sur le fork GitHub
          git push origin "$PR_BRANCH" --force
